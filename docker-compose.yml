name: poc-message-breaker

services:
  kafka:
    build: ./infra/kafka
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "env -u KAFKA_OPTS /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "8085:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: poc
      RABBITMQ_DEFAULT_PASS: poc
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-poc.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "5552:5552"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 30s

  order-producer-kafka:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-producer
    image: poc/order-producer:local
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"

  order-producer-rabbitmq:
    image: poc/order-producer:local
    environment:
      SPRING_PROFILES_ACTIVE: rabbitmq
      RABBITMQ_HOST: rabbitmq
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      rabbitmq:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8080"

  order-consumer-kafka:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-consumer-kafka
    image: poc/order-consumer-kafka:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PROCESSING_DELAY_MS: "0"
      PROCESSING_FAILURE_RATE: "0"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8081:8080"

  order-consumer-rabbitmq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order-consumer-rabbitmq
    image: poc/order-consumer-rabbitmq:local
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STREAM_PORT: "5552"
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PROCESSING_DELAY_MS: "0"
      PROCESSING_FAILURE_RATE: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
